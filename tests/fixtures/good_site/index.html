<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoodApp — project tracking</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #111; background: #fff; }
    nav a { display: inline-block; padding: 12px 16px; color: #0b57d0; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    label { display: block; margin-top: 12px; }
    input { font-size: 16px; padding: 10px; width: 100%; box-sizing: border-box; }
    button { font-size: 16px; padding: 12px 20px; margin-top: 12px; min-height: 44px; }
    a:focus, button:focus, input:focus { outline: 3px solid #0b57d0; }
    #consent { position: fixed; bottom: 0; left: 0; right: 0; background: #eee; padding: 16px; }
  </style>
</head>
<body>
  <nav aria-label="Main">
    <a href="/pricing">Pricing</a>
    <a href="/security">Security</a>
    <a href="/docs">Docs</a>
    <a href="https://status.goodapp.test/">Status</a>
  </nav>
  <main>
    <h1>Track projects without the chaos</h1>
    <form aria-label="Log in">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button type="button" aria-label="Show password">Show</button>
      <button type="submit">Log in</button>
    </form>
  </main>
  <div id="consent" role="dialog" aria-label="Cookie consent">
    We use cookies to improve your experience.
    <button type="button">Accept all</button>
    <button type="button">Reject</button>
  </div>
</body>
</html>
